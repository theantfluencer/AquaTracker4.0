<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="theme-color"
          content="#2FBF71">

    <meta name="description"
          content="AquaTracker – Professionelle Verwaltung deiner Aquarien">

    <title>AquaTracker 4.0</title>

    <link rel="manifest"
          href="manifest.json">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
          rel="stylesheet">

    <link rel="stylesheet"
          href="assets/css/variables.css">

    <link rel="stylesheet"
          href="assets/css/app.css">

</head>

<body>

<div id="app">

    <main id="app-content"></main>

    <button id="fab"
            class="fab"
            aria-label="Aquarium hinzufügen">

        <span class="material-symbols-rounded">
            add
        </span>

    </button>

</div>

<dialog id="dialog"></dialog>

<div id="snackbar"
     aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/aquarium.js"></script>
<script src="js/app.js"></script>

</body>

</html>
