<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="theme-color"
          content="#2FBF71">

    <meta name="description"
          content="AquaTracker – Professionelle Verwaltung deiner Aquarien">

    <title>AquaTracker 4.0</title>

    <link rel="manifest"
          href="manifest.json">

    <link rel="icon"
          href="assets/icons/icon-192.png">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
          rel="stylesheet">

    <link rel="stylesheet"
          href="assets/css/variables.css">

    <link rel="stylesheet"
          href="assets/css/reset.css">

    <link rel="stylesheet"
          href="assets/css/layout.css">

    <link rel="stylesheet"
          href="assets/css/components.css">

    <link rel="stylesheet"
          href="assets/css/pages.css">

    <link rel="stylesheet"
          href="assets/css/app.css">

</head>

<body>

    <div id="app">

        <!-- Header -->

        <header id="app-header"></header>

        <!-- Hauptinhalt -->

        <main id="app-content">

            <!-- Wird durch JavaScript gerendert -->

        </main>

        <!-- Bottom Navigation -->

        <nav id="bottom-navigation"></nav>

        <!-- Floating Action Button -->

        <button id="fab"
                class="fab"
                aria-label="Aquarium hinzufügen">

            <span class="material-symbols-rounded">

                add

            </span>

        </button>

    </div>

    <!-- Dialoge -->

    <dialog id="dialog"></dialog>

    <!-- Snackbar -->

    <div id="snackbar"
         aria-live="polite"></div>

    <!-- Scripts -->

    <script src="js/core/config.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/data.js"></script>
    <script src="js/core/router.js"></script>

    <script src="js/ui/theme.js"></script>
    <script src="js/ui/snackbar.js"></script>
    <script src="js/ui/dialog.js"></script>
    <script src="js/ui/navigation.js"></script>

    <script src="js/components/header.js"></script>
    <script src="js/components/fab.js"></script>
    <script src="js/components/empty-state.js"></script>
    <script src="js/components/stat-card.js"></script>
    <script src="js/components/aquarium-card.js"></script>

    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/aquarium.js"></script>
    <script src="js/pages/calendar.js"></script>
    <script src="js/pages/products.js"></script>
    <script src="js/pages/settings.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
